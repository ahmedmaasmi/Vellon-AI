# Base compose: development (hot reload). For production use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# Run from repo root: docker compose up --build
# Optional in .env: API_PORT, FRONTEND_PORT, POSTGRES_PORT, REDIS_PORT if host ports conflict; DATABASE_URL for local (non-Docker) runs.

services:
  api:
    build:
      context: ./backend
      dockerfile: docker/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Use postgres/redis hostnames inside Docker; .env DATABASE_URL is for local (non-Docker) runs.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - ./backend/media:/app/media
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Browser calls the host-mapped API port (same as api service API_PORT).
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8000}
      - WATCHPACK_POLLING=true
      # Use webpack instead of Turbopack if dev server restarts on route compile (e.g. /signin)
      - NEXT_DEV_USE_WEBPACK=1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Set POSTGRES_PORT=5433 in .env if host 5432 is already in use.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # $$ so Compose does not substitute host env (empty); shell inside container expands Postgres env.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Set REDIS_PORT=6380 in .env if host 6379 is already in use.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

networks:
  default:
    name: vellon-ai-backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
