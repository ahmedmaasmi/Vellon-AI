# Production overrides: no host ports for DB/Redis, stricter limits
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    ports: []  # Remove host port; expose only on internal network (use reverse proxy)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    ports: []  # Expose only via reverse proxy in production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    ports: []  # No host exposure; only API (and optional worker) on internal network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    ports: []  # No host exposure
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
