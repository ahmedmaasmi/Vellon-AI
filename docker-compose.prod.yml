# Production overrides: no dev volumes/reload, no host ports for DB/Redis, stricter limits
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    volumes: []
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: []  # Remove host port; expose only on internal network (use reverse proxy)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes: []
    ports: []  # Expose only via reverse proxy in production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    ports: []  # No host exposure; only API (and optional worker) on internal network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  redis:
    ports: []  # No host exposure
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
